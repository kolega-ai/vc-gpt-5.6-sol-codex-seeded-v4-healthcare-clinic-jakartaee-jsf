services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clinic_local_only}
    volumes:
      - clinic-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinic
      DB_USER: clinic
      DB_PASSWORD: ${DB_PASSWORD:-clinic_local_only}
      CLINIC_TOKEN_SECRET: ${CLINIC_TOKEN_SECRET:-local-dev-secret-change-before-deployment-32chars}
      CLINIC_UPLOAD_DIR: /opt/clinic/uploads
      JAVA_OPTS: -Xms64m -Xmx384m -Djava.net.preferIPv4Stack=true -Djava.awt.headless=true
    ports:
      - "8080:8080"
    volumes:
      - clinic-uploads:/opt/clinic/uploads
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  clinic-db:
  clinic-uploads:
