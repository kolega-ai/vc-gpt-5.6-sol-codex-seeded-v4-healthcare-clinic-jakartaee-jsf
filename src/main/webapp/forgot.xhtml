<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"><h:head><title>Reset password · Harbour Clinic</title><meta name="viewport" content="width=device-width,initial-scale=1"/><h:outputStylesheet library="clinic" name="app.css"/></h:head><h:body><main class="auth-shell"><section class="auth-panel"><h:link outcome="/login.xhtml" styleClass="brand auth-brand"><span class="brand-mark">H</span><span><strong>Harbour Clinic</strong><small>Patient portal</small></span></h:link><h1>Reset your password.</h1><p>Enter your email. We’ll write a single-use, 30-minute reset link to the local email outbox.</p><h:messages globalOnly="true" infoClass="message message-info" errorClass="message message-error"/><h:form><div class="field"><h:outputLabel for="email" value="Email address"/><h:inputText id="email" value="#{accountBean.email}" required="true" maxlength="160"/></div><div class="form-actions"><h:commandButton action="#{accountBean.requestReset}" value="Send reset link" styleClass="button button-primary"/><h:link outcome="/login.xhtml" value="Back to sign in" styleClass="button button-secondary"/></div></h:form></section><section class="auth-art"><div class="auth-quote"><h1>One secure step back into your care record.</h1></div></section></main></h:body></html>
