<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" template="/WEB-INF/templates/app.xhtml"><ui:define name="title">Visit notes</ui:define><ui:define name="crumb">Clinical / Visit notes</ui:define><ui:define name="eyebrow">Assigned appointment</ui:define><ui:define name="heading">Document the visit</ui:define><ui:define name="subheading">Complete the appointment, save the clinical record, prescribe, then release patient-ready instructions.</ui:define><ui:define name="content"><section class="card form-card"><h2>Visit summary</h2><h:form><div class="form-grid"><div class="field"><h:outputLabel for="appointment" value="Appointment ID"/><h:inputText id="appointment" value="#{clinicalBean.appointmentId}" required="true"/></div><div class="field"><h:outputLabel for="summary" value="Draft summary ID"/><h:inputText id="summary" value="#{clinicalBean.summaryId}"/></div><div class="field field-full"><h:outputLabel for="diagnosis" value="Assessment"/><h:inputTextarea id="diagnosis" value="#{clinicalBean.diagnosis}" required="true" maxlength="1000"/></div><div class="field field-full"><h:outputLabel for="care" value="Patient care instructions"/><h:inputTextarea id="care" value="#{clinicalBean.careInstructions}" required="true" maxlength="4000"/></div><div class="field field-full"><h:outputLabel for="notes" value="Internal clinician notes"/><h:inputTextarea id="notes" value="#{clinicalBean.clinicianNotes}" required="true" maxlength="6000"/></div></div><div class="form-actions"><h:commandButton action="#{clinicalBean.completeAppointment}" value="Mark visit completed" styleClass="button button-secondary"/><h:commandButton action="#{clinicalBean.saveSummary}" value="Save draft" styleClass="button button-secondary"/><h:commandButton action="#{clinicalBean.release}" value="Release to patient" styleClass="button button-primary" onclick="return confirm('Release this summary? It cannot be edited afterward.');"/></div></h:form></section><section class="card form-card" style="margin-top:20px"><h2>Create prescription</h2><h:form><div class="form-grid"><div class="field"><h:outputLabel for="patient" value="Patient ID"/><h:inputText id="patient" value="#{clinicalBean.patientId}" required="true"/></div><div class="field"><h:outputLabel for="medication" value="Medication"/><h:inputText id="medication" value="#{clinicalBean.medication}" required="true" maxlength="160"/></div><div class="field"><h:outputLabel for="dosage" value="Dosage"/><h:inputText id="dosage" value="#{clinicalBean.dosage}" required="true" maxlength="100"/></div><div class="field field-full"><h:outputLabel for="instructions" value="Patient instructions"/><h:inputTextarea id="instructions" value="#{clinicalBean.instructions}" required="true" maxlength="1000"/></div></div><div class="form-actions"><h:commandButton action="#{clinicalBean.createPrescription}" value="Create prescription" styleClass="button button-primary"/></div></h:form></section></ui:define></ui:composition>
