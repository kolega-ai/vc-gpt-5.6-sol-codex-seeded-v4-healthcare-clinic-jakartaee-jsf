<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" template="/WEB-INF/templates/app.xhtml"><ui:define name="title">Chart link</ui:define><ui:define name="crumb">Patients / Chart link</ui:define><ui:define name="eyebrow">Shared chart reference</ui:define><ui:define name="heading">Open a chart link</ui:define><ui:define name="subheading">Sealed chart references let a colleague open the same record without sharing the patient id.</ui:define><ui:define name="content"><section class="card form-card"><h2>Open or prepare a reference</h2><h:form><div class="form-grid"><div class="field field-full"><h:outputLabel for="ref" value="Chart link reference"/><h:inputText id="ref" value="#{chartLinkBean.chartRef}" maxlength="220"/></div><div class="field field-full"><h:outputLabel for="patient" value="Patient id (to prepare a new reference)"/><h:inputText id="patient" value="#{chartLinkBean.patientId}"/></div></div><div class="form-actions"><h:commandButton action="#{chartLinkBean.open}" value="Open chart link" styleClass="button button-primary"/><h:commandButton action="#{chartLinkBean.share}" value="Prepare reference" styleClass="button button-secondary"/></div></h:form><h:panelGroup rendered="#{not empty chartLinkBean.notice}"><div class="callout"><strong>#{chartLinkBean.notice}</strong></div></h:panelGroup></section></ui:define></ui:composition>
