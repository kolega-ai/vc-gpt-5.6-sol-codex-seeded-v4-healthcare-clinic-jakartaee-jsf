<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets" template="/WEB-INF/templates/app.xhtml"><ui:define name="title">Patients</ui:define><ui:define name="crumb">Patients</ui:define><ui:define name="eyebrow">Authorised records</ui:define><ui:define name="heading">Patient directory</ui:define><ui:define name="subheading">Search the records available to your role and clinical assignment.</ui:define><ui:define name="content"><h:form><div class="filter-bar"><div class="field"><h:outputLabel for="query" value="Name or medical record number"/><h:inputText id="query" value="#{portalBean.patientQuery}" maxlength="120"/></div><h:commandButton value="Search patients" styleClass="button button-primary"/></div></h:form><div class="table-wrap"><table class="table"><thead><tr><th>Patient</th><th>MRN</th><th>Date of birth</th><th>Contact</th><th></th></tr></thead><tbody><ui:repeat value="#{portalBean.patients}" var="p"><tr><td class="cell-title">#{p.fullName}</td><td class="code">#{p.mrn}</td><td>#{p.dateOfBirth}</td><td><div>#{p.email}</div><div class="cell-sub">#{p.phone}</div></td><td><h:link outcome="/app/chart.xhtml" value="Open chart" styleClass="button button-secondary button-small"><f:param name="patientId" value="#{p.id}"/></h:link></td></tr></ui:repeat></tbody></table></div></ui:define></ui:composition>
