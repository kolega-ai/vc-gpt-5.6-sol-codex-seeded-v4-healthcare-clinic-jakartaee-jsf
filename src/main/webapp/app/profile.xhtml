<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" template="/WEB-INF/templates/app.xhtml"><ui:define name="title">Profile</ui:define><ui:define name="crumb">Profile</ui:define><ui:define name="eyebrow">Account</ui:define><ui:define name="heading">Profile &amp; security</ui:define><ui:define name="subheading">Keep your account identity current. Changes are recorded in the audit trail.</ui:define><ui:define name="content"><section class="card form-card"><h2>Profile details</h2><h:form><div class="form-grid"><div class="field field-full"><h:outputLabel for="name" value="Display name"/><h:inputText id="name" value="#{accountBean.displayName}" required="true" maxlength="120"/></div><div class="field field-full"><h:outputLabel for="email" value="Email address"/><h:inputText id="email" value="#{accountBean.email}" required="true" maxlength="160"/></div><div class="field field-full"><h:outputLabel for="record" value="Linked patient record"/><h:inputText id="record" value="#{accountBean.patientId}" maxlength="12"/><small>The clinic record this sign-in is attached to. Leave blank for staff accounts.</small></div></div><div class="form-actions"><h:commandButton action="#{accountBean.update}" value="Save profile" styleClass="button button-primary"/></div></h:form></section></ui:define></ui:composition>
