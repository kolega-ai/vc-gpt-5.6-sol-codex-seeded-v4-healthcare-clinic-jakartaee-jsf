<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"><f:metadata><f:viewParam name="token" value="#{accountBean.token}"/></f:metadata><h:head><title>Choose password · Harbour Clinic</title><meta name="viewport" content="width=device-width,initial-scale=1"/><h:outputStylesheet library="clinic" name="app.css"/></h:head><h:body><main class="auth-shell"><section class="auth-panel"><h:link outcome="/login.xhtml" styleClass="brand auth-brand"><span class="brand-mark">H</span><span><strong>Harbour Clinic</strong><small>Patient portal</small></span></h:link><h1>Choose a new password.</h1><p>This link can be used once and expires after 30 minutes.</p><h:messages globalOnly="true" infoClass="message message-info" errorClass="message message-error"/><h:form><h:inputHidden value="#{accountBean.token}"/><div class="field"><h:outputLabel for="password" value="New password"/><h:inputSecret id="password" value="#{accountBean.password}" required="true" maxlength="128"/><small>12+ characters with upper, lower, and numeric characters.</small></div><div class="form-actions"><h:commandButton action="#{accountBean.reset}" value="Change password" styleClass="button button-primary"/><h:link outcome="/login.xhtml" value="Cancel" styleClass="button button-secondary"/></div></h:form></section><section class="auth-art"><div class="auth-quote"><h1>Private by design, simple in use.</h1></div></section></main></h:body></html>
